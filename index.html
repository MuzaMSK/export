    #loading {

      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    #loading-detail { font-size: 10px; opacity: 0.5; margin-top: 10px; text-align: center; max-width: 80vw; }
    #hud, #controls, #players, #fps {
      position: fixed; color: #fff; background: rgba(0,0,0,0.55);
      padding: 6px 12px; border-radius: 6px; font-size: 12px;
      pointer-events: none; z-index: 100; text-shadow: 0 1px 2px #000;
    }
    #hud { top: 10px; left: 10px; }
    #players { top: 10px; right: 10px; }
    #fps { top: 42px; right: 10px; }
    #controls { bottom: 10px; left: 50%; transform: translateX(-50%); white-space: nowrap; }
    @media (hover: none) {
      #controls { font-size: 11px; bottom: 8px; }
    }
